name: iOS Ad Hoc IPA

on:
  workflow_dispatch:
  push:
    branches: [garage-monitor/ios-ad-hoc]
    paths: [.github/workflows/ios-ad-hoc.yml]

permissions:
  contents: read

jobs:
  archive:
    if: github.event.repository.private
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check signing inputs
        env:
          HAS_CERT: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_AD_HOC_PROFILE_BASE64 != '' }}
        run: test "$HAS_CERT" = true || { echo 'Configure the three iOS signing secrets before rerunning.'; exit 1; }
        working-directory: .
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: pod install
        working-directory: mobile/ios
      - name: Sign, archive and export
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_AD_HOC_PROFILE_BASE64: ${{ secrets.IOS_AD_HOC_PROFILE_BASE64 }}
        run: bash scripts/export-ad-hoc.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GarageMonitor-iOS-AdHoc
          path: ${{ runner.temp }}/garage-export/*.ipa
          if-no-files-found: error
          retention-days: 3
