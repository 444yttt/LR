name: Nostos TestFlight

# Manual dispatch signs with an App Store Connect API key and uploads with altool.
# Repository secret names: ASC_KEY_ID, ASC_ISSUER_ID, APPLE_TEAM_ID, and
# ASC_PRIVATE_KEY (raw .p8). ASC_KEY_BASE64 is accepted when ASC_PRIVATE_KEY is unset.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: true
  push:
    branches:
      - garage-monitor/ios-ad-hoc
      - nostos/testflight-asc-signing
      - nostos/data-pipeline-hardening
      - nostos/safe-area
    paths:
      - .github/workflows/ios-testflight.yml
      - mobile/**
  pull_request:
    branches:
      - garage-monitor/ios-ad-hoc
    paths:
      - .github/workflows/ios-testflight.yml
      - mobile/**

concurrency:
  group: nostos-ios-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ios:
    name: Nostos iOS
    if: github.repository == '444yttt/LR'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
      # Public Expo settings from repository Variables. An unset variable is empty,
      # which leaves the app in its existing not-configured state.
      EXPO_PUBLIC_GARAGE_API_URL: ${{ vars.EXPO_PUBLIC_GARAGE_API_URL }}
      EXPO_PUBLIC_GARAGE_ISSUER: ${{ vars.EXPO_PUBLIC_GARAGE_ISSUER }}
      EXPO_PUBLIC_GARAGE_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GARAGE_CLIENT_ID }}
      EXPO_PUBLIC_GARAGE_RESOURCE: ${{ vars.EXPO_PUBLIC_GARAGE_RESOURCE }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require App Store Connect secrets
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          if [ -z "$ASC_KEY_ID" ]; then missing+=("ASC_KEY_ID"); fi
          if [ -z "$ASC_ISSUER_ID" ]; then missing+=("ASC_ISSUER_ID"); fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing+=("APPLE_TEAM_ID"); fi
          if [ -z "$ASC_PRIVATE_KEY" ] && [ -z "$ASC_KEY_BASE64" ]; then
            missing+=("ASC_PRIVATE_KEY or ASC_KEY_BASE64")
          fi
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "App Store Connect signing secrets are missing:"
            for name in "${missing[@]}"; do
              echo "  - ${name}"
            done
            echo "Add those secret names in the repository settings, then rerun this workflow."
            exit 1
          fi

      - name: Select latest Xcode 26
        working-directory: .
        run: |
          set -euo pipefail
          selected=$(python3 - <<'PY'
          import pathlib, re, sys
          apps = []
          for path in pathlib.Path("/Applications").glob("Xcode_26*.app"):
              match = re.fullmatch(r"Xcode_(\d+(?:\.\d+)*)", path.name.removesuffix(".app"))
              if match:
                  apps.append((tuple(int(part) for part in match.group(1).split(".")), path))
          if not apps:
              print("No Xcode 26 installation found under /Applications.", file=sys.stderr)
              sys.exit(1)
          apps.sort()
          print(apps[-1][1])
          PY
          )
          echo "Selected Xcode: $selected"
          sudo xcode-select -s "$selected"
          xcodebuild -version
          version=$(xcodebuild -version | awk 'NR==1 { print $2 }')
          case "$version" in
            26.*) ;;
            *) echo "Expected Xcode 26, found $version"; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx expo prebuild --platform ios --clean --no-install

      - name: Expose public Garage settings to Xcode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shlex
          keys = [
              "EXPO_PUBLIC_GARAGE_API_URL",
              "EXPO_PUBLIC_GARAGE_ISSUER",
              "EXPO_PUBLIC_GARAGE_CLIENT_ID",
              "EXPO_PUBLIC_GARAGE_RESOURCE",
          ]
          lines = []
          for key in keys:
              value = os.environ.get(key, "")
              if "\n" in value or "\x00" in value:
                  raise SystemExit(key + " must be a single line")
              lines.append("export " + key + "=" + shlex.quote(value))
          pathlib.Path("ios/.xcode.env.local").write_text("\n".join(lines) + "\n")
          PY

      - name: Check prebuilt iOS project
        run: |
          set -euo pipefail
          if find ios -name '*.entitlements' -print0 | xargs -0 grep -l 'aps-environment' 2>/dev/null | grep -q .; then
            echo "The prebuilt project contains the aps-environment entitlement."
            echo "Local notifications must not require Push Notifications."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, plistlib, sys
          plists = [path for path in pathlib.Path("ios").rglob("Info.plist") if "Pods" not in path.parts]
          matched = False
          for path in plists:
              data = plistlib.loads(path.read_bytes())
              version = data.get("CFBundleShortVersionString")
              build = data.get("CFBundleVersion")
              encryption = data.get("ITSAppUsesNonExemptEncryption")
              print(f"{path}: version={version!r} build={build!r} encryption={encryption!r}")
              if version == "1.0.0" and build == "$(CURRENT_PROJECT_VERSION)" and encryption is False:
                  matched = True
          if not matched:
              sys.exit("App Info.plist is missing version 1.0.0, CURRENT_PROJECT_VERSION, or ITSAppUsesNonExemptEncryption=false")
          PY
          if grep -q -R "DEVELOPMENT_TEAM = [^;[:space:]]" ios/*.xcodeproj/project.pbxproj; then
            echo "DEVELOPMENT_TEAM must come from the APPLE_TEAM_ID secret at build time."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, sys
          pbx = next(pathlib.Path("ios").glob("*.xcodeproj/project.pbxproj"))
          text = pbx.read_text()
          required = [
              "NostosWidget.appex in Embed Foundation Extensions",
              "PRODUCT_BUNDLE_IDENTIFIER = studio.naus.garagemonitor.widget",
              'productType = "com.apple.product-type.app-extension"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              sys.exit("Prebuilt Xcode project is missing the widget target or Embed Foundation Extensions phase: " + "; ".join(missing))
          print(f"{pbx}: widget target and Embed Foundation Extensions are present")
          intent = pathlib.Path("targets/widget/_shared/VehicleIntent.swift")
          if not intent.is_file() or "struct SelectVehicleIntent: WidgetConfigurationIntent" not in intent.read_text():
              sys.exit("SelectVehicleIntent must live in targets/widget/_shared so the main app target links it")
          print(f"{intent}: SelectVehicleIntent is in _shared")
          if "CODE_SIGN_ENTITLEMENTS = Nostos/Nostos.entitlements" not in text:
              sys.exit("App target is missing CODE_SIGN_ENTITLEMENTS = Nostos/Nostos.entitlements")
          if "CODE_SIGN_ENTITLEMENTS = ../targets/widget/generated.entitlements" not in text:
              sys.exit("Widget target is missing CODE_SIGN_ENTITLEMENTS = ../targets/widget/generated.entitlements")
          print("CODE_SIGN_ENTITLEMENTS is set for the app and the widget")
          PY
          python3 - <<'PY'
          import pathlib, plistlib, sys
          group = "group.studio.naus.garagemonitor"
          key = "com.apple.security.application-groups"
          sources = [
              pathlib.Path("ios/Nostos/Nostos.entitlements"),
              pathlib.Path("targets/widget/generated.entitlements"),
          ]
          for path in sources:
              if not path.is_file():
                  sys.exit(f"prebuild entitlements file is missing: {path}")
              ents = plistlib.loads(path.read_bytes())
              groups = ents.get(key)
              print(f"{path}: application-groups={groups!r} keys={sorted(ents)}")
              if group not in (groups or []):
                  sys.exit(f"{path} does not declare {group}")
          PY

      - run: pod install
        working-directory: mobile/ios

      - name: Build for iOS Simulator
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet

      - name: Install App Store Connect API key
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            key_body=$(printf '%s' "$ASC_PRIVATE_KEY" | sed 's/\\n/\n/g')
          else
            key_body=$(printf '%s' "$ASC_KEY_BASE64" | base64 -D)
          fi
          case "$key_body" in
            *$'\n') ;;
            *) key_body="${key_body}"$'\n' ;;
          esac
          for dir in "$HOME/private_keys" "$HOME/.private_keys" "$HOME/.appstoreconnect/private_keys"; do
            mkdir -p "$dir"
            printf '%s' "$key_body" > "$dir/AuthKey_${ASC_KEY_ID}.p8"
            chmod 600 "$dir/AuthKey_${ASC_KEY_ID}.p8"
          done
          unset ASC_PRIVATE_KEY ASC_KEY_BASE64 key_body
          key_path="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$key_path"; then
            echo "The App Store Connect API key is not a PEM private key."
            echo "Set ASC_PRIVATE_KEY to the raw .p8 contents, or ASC_KEY_BASE64 to its base64 encoding."
            exit 1
          fi

      - name: Archive
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild archive \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nostos.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      # Unsigned archives skip ProcessProductPackaging, so exportArchive would not
      # see application-groups and would sign a default App Store entitlement set.
      # Copy the prebuild entitlements into the archive as xcent so export requests
      # the App Group. -allowProvisioningUpdates may then attach it; if the portal
      # has no group, export or the IPA check will fail and we must not upload.
      - name: Put App Group entitlements in the unsigned archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, shutil, sys
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "Nostos.xcarchive"
          app = archive / "Products/Applications/Nostos.app"
          widget = app / "PlugIns" / "NostosWidget.appex"
          group = "group.studio.naus.garagemonitor"
          key = "com.apple.security.application-groups"
          sources = (
              ("app", app, Path("ios/Nostos/Nostos.entitlements")),
              ("widget", widget, Path("targets/widget/generated.entitlements")),
          )
          for label, dest, src in sources:
              if not dest.is_dir():
                  sys.exit(f"unsigned archive is missing {dest}")
              if not src.is_file():
                  sys.exit(f"prebuild entitlements file is missing: {src}")
              ents = plistlib.loads(src.read_bytes())
              groups = ents.get(key)
              print(f"{src}: application-groups={groups!r} keys={sorted(ents)}")
              if group not in (groups or []):
                  sys.exit(f"{src} does not declare {group}")
              xcent = dest / "archived-expanded-entitlements.xcent"
              existing = list(dest.glob("*.xcent"))
              print(f"{label} archive xcent before copy: {[p.name for p in existing]}")
              shutil.copyfile(src, xcent)
              print(f"wrote {xcent}")
          PY

      - name: Export IPA
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Nostos.xcarchive" \
            -exportPath "$RUNNER_TEMP/nostos-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Check widget is in the signed IPA
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/nostos-export" -name '*.ipa' -print -quit)
          test -n "$ipa"
          python3 - "$ipa" <<'PY'
          import plistlib, subprocess, sys, tempfile, zipfile
          from pathlib import Path

          ipa = Path(sys.argv[1])
          with tempfile.TemporaryDirectory() as tmp:
              with zipfile.ZipFile(ipa) as zf:
                  zf.extractall(tmp)
              apps = list(Path(tmp).glob("Payload/*.app"))
              if len(apps) != 1:
                  sys.exit(f"expected one Payload/*.app, found {apps}")
              app = apps[0]
              plugins = list((app / "PlugIns").glob("*.appex")) if (app / "PlugIns").is_dir() else []
              print("app", app.name, "appexes", [p.name for p in plugins])
              widget = app / "PlugIns" / "NostosWidget.appex"
              if not widget.is_dir():
                  sys.exit("signed IPA is missing Payload/*.app/PlugIns/NostosWidget.appex")
              info = plistlib.loads((widget / "Info.plist").read_bytes())
              point = (info.get("NSExtension") or {}).get("NSExtensionPointIdentifier")
              bundle = info.get("CFBundleIdentifier")
              version = info.get("CFBundleShortVersionString")
              build = info.get("CFBundleVersion")
              print(f"widget Info.plist bundle={bundle!r} version={version!r} build={build!r} extension={point!r}")
              if point != "com.apple.widgetkit-extension":
                  sys.exit("widget NSExtensionPointIdentifier must be com.apple.widgetkit-extension")
              if bundle != "studio.naus.garagemonitor.widget":
                  sys.exit("widget CFBundleIdentifier must be studio.naus.garagemonitor.widget")
              if version != "1.0.0":
                  sys.exit("widget CFBundleShortVersionString must be 1.0.0")

              def entitlements(path: Path) -> dict:
                  raw = subprocess.check_output(
                      ["codesign", "-d", "--entitlements", ":-", "--xml", str(path)],
                      stderr=subprocess.DEVNULL,
                  )
                  if raw.startswith(b"\xfa\xde\x0c\xc0"):
                      raw = raw[raw.find(b"<?xml"):] if b"<?xml" in raw else raw[8:]
                  try:
                      return plistlib.loads(raw)
                  except Exception:
                      sys.exit(f"could not parse entitlements for {path.name} (type {raw[:16]!r})")

              # Print both binaries first. No signing material, only keys and these values.
              missing = []
              for label, path in (("app", app), ("widget", widget)):
                  ents = entitlements(path)
                  groups = ents.get("com.apple.security.application-groups")
                  print(
                      f"{label} application-identifier={ents.get('application-identifier')!r} "
                      f"application-groups={groups!r} get-task-allow={ents.get('get-task-allow')!r} "
                      f"keys={sorted(ents)}"
                  )
                  if "group.studio.naus.garagemonitor" not in (groups or []):
                      missing.append(label)
              if missing:
                  sys.exit("signed IPA is missing App Group group.studio.naus.garagemonitor on: " + ", ".join(missing))
          print("IPA contains the WidgetKit appex with the expected bundle id, extension point, and App Group")
          PY

      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/nostos-export" -name '*.ipa' -print -quit)
          test -n "$ipa"
          xcrun altool --upload-app \
            --type ios \
            --file "$ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
