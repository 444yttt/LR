name: Nostos TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed build to App Store Connect
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == '444yttt/LR' && github.ref == 'refs/heads/garage-monitor/ios-ad-hoc'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check signing inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          HAS_CERT: ${{ secrets.IOS_P12_BASE64 != '' && secrets.IOS_P12_PASSWORD != '' && secrets.IOS_APP_STORE_PROFILE_BASE64 != '' }}
        run: test "$HAS_CERT" = true || { echo 'Configure the three iOS signing secrets before rerunning.'; exit 1; }
        working-directory: .
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx expo prebuild --platform ios --clean --no-install
      - run: pod install
        working-directory: mobile/ios
      - name: Build for iOS Simulator
        if: github.event_name == 'push'
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Sign, archive and export
        if: github.event_name == 'workflow_dispatch'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: bash scripts/export-testflight.sh
      - name: Upload to App Store Connect
        if: github.event_name == 'workflow_dispatch' && inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          : "${ASC_KEY_ID:?Missing ASC_KEY_ID}"
          : "${ASC_ISSUER_ID:?Missing ASC_ISSUER_ID}"
          : "${ASC_KEY_BASE64:?Missing ASC_KEY_BASE64}"
          key_dir=$(mktemp -d "$RUNNER_TEMP/nostos-upload.XXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s' "$ASC_KEY_BASE64" | base64 -D > "$key_dir/AuthKey_$ASC_KEY_ID.p8"
          unset ASC_KEY_BASE64
          ipa=$(find "$RUNNER_TEMP/nostos-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          API_PRIVATE_KEYS_DIR="$key_dir" xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
